<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Zurück zu Pegel</title>
<style>
  body { font-family: sans-serif; margin: 2rem 1.25rem; max-width: 32rem; line-height: 1.5; }
  a.knopf { display: inline-block; padding: 0.75rem 1.25rem; background: #1b5e20; color: #fff; border-radius: 0.5rem; text-decoration: none; }
</style>
</head>
<body>
<h1>Zurück zu Pegel</h1>
<p>Du kommst gleich zurück in die App. Falls nicht, tippe auf den Knopf.</p>
<p><a id="zurueck" class="knopf" href="#">Zurück zu Pegel</a></p>
<noscript><p>Der Knopf braucht JavaScript. Bitte schalte es für diese Seite ein.</p></noscript>
<script>
  // Die Adresse wird nur aus dem Suchteil gebaut und weitergereicht; die Seite speichert, sendet und zeigt nichts davon.
  var adresse = "intent://bank-rueckkehr" + location.search + "#Intent;scheme=pegel;package=app.pegel.budget;end";
  document.getElementById("zurueck").href = adresse;
  location.replace(adresse);
</script>
</body>
</html>
